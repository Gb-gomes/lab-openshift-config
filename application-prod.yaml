apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Gb-Gomes/lab-openshift-config.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: $USUARIO-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true