apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Gb-Gomes/lab-openshift-config.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: $USUARIO-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true